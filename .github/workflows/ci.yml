name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify canonical Pages build
        run: |
          npm run build:pages
          node --check dist-pages/sw.js
          node scripts/check-pages-build.mjs
      - name: Verify develop Pages build
        env:
          PAGES_BASE: /ATPComicManager/develop/
        run: |
          npm run build:pages
          node --check dist-pages/sw.js
          node scripts/check-pages-build.mjs
